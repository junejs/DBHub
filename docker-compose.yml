services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dbhub
      POSTGRES_PASSWORD: dbhub
      POSTGRES_DB: dbhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbhub -d dbhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      DB_DSN: postgres://dbhub:dbhub@db:5432/dbhub?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MASTER_KEY: ${MASTER_KEY:-change-me-in-production}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
