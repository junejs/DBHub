openapi: 3.0.3

info:
  title: DBHUB API
  description: |
    集中式数据库查询与导出平台 API（v1）。

    本文件是系统对外 API 的**唯一事实来源**（详见 `prd_document/12-api-contract.md`），
    传输为 HTTP/JSON，采用 Google AIP 风格的资源命名与标准方法。版本前缀 `/v1`。

    ## 路径约定
    - 资源路径层级反映归属与隔离（`projects/{project}/instances/{instance}/databases/{database}`）。
    - 自定义动作用 `:verb` 后缀（`:query`、`:export`、`:sync`、`:download`、`:test`、
      `:search`、`:undelete`、`:favorite`、`:markRead` 等），以 POST/GET 调用。
    - IAM 方法（`:getIamPolicy` / `:setIamPolicy` / `:testIamPermissions`）作用于任意资源，
      因资源名含 `/`，统一在请求体 `resource` 字段中传递，挂载在 `/iam:verb`。
    - 审计 `:search` / `:export` 的 `parent`（`projects/{p}` 或省略=全局）亦在请求体中传递。

    ## 声明式权限 / 审计（横切层）
    每个操作通过 OpenAPI 扩展声明，由服务端横切层（中间件）在请求处理前强制，业务代码无法绕过：
    - `x-requires-permission`: 粗粒度功能权限，如 `db.sql.select`；空串表示无需鉴权/公开。
    - `x-audit`: 是否记录审计日志（boolean）。
    - `x-auth-method`: `ACL`（默认，按权限判定）或 `CUSTOM`（按资源归属判定，如个人收藏/通知/自身历史）。
    - `x-allow-without-credential`: 未登录即可调用（登录类、CSRF、SSO 按钮渲染）。

    ## LSP（SQL 自动补全）
    V1 核心特性，独立于 REST，协议为 **JSON-RPC 2.0 over WebSocket**，端点 `wss://<host>/v1/lsp`，
    不纳入本 REST 路径清单（详见 12-api-contract.md §6.15）。

  version: 1.0.0
  license:
    name: proprietary
  contact:
    name: DBHUB

externalDocs:
  description: API 契约设计文档
  url: ./prd_document/12-api-contract.md

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: System
    description: 健康检查与就绪检查
  - name: Auth
    description: 认证、会话、密码重置、CSRF
  - name: SQL
    description: SQL 查询、同步导出、查询历史
  - name: Export
    description: 异步导出任务与产物下载
  - name: Instance
    description: 数据库实例与数据源（项目内）
  - name: Database
    description: 逻辑数据库与 schema 同步
  - name: IAM
    description: 权限绑定（类 GCP IAM）
  - name: Audit
    description: 审计日志检索与导出
  - name: Project
    description: 项目（团队隔离边界）
  - name: Environment
    description: 环境与策略维度
  - name: User
    description: 用户与个人设置
  - name: Group
    description: 用户组与成员
  - name: IDP
    description: 身份提供商（OIDC/LDAP）
  - name: Worksheet
    description: 保存的查询、收藏与分享
  - name: Notification
    description: 站内通知
  - name: Setting
    description: 平台设置（k/v）

paths:

  # ───────────────────────────── System ─────────────────────────────
  /healthz:
    get:
      tags: [System]
      operationId: healthz
      summary: 存活检查
      description: 进程存活探针，不做就绪判定，不依赖下游。
      x-requires-permission: ""
      x-audit: false
      x-allow-without-credential: true
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [System]
      operationId: readyz
      summary: 就绪检查
      description: 校验平台元数据库连通性，可承接流量时返回 ready。
      x-requires-permission: ""
      x-audit: false
      x-allow-without-credential: true
      security: []
      responses:
        '200':
          description: Ready
          content:
            text/plain:
              schema:
                type: string
                example: ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ───────────────────────────── Auth ─────────────────────────────
  /v1/auth:login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: 登录
      description: |
        邮箱密码登录；若该账号开启 MFA，返回 `mfa_temp_token`（access_token 为空），
        需再次以 `mfa_temp_token` + `otp_code`/`recovery_code` 完成二次验证。
        失败按锁定窗口计数（密码 10/10min、MFA 5/5min，见 14-F）。
      x-requires-permission: ""
      x-audit: true
      x-allow-without-credential: true
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth:logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: 登出
      description: 吊销当前 refresh token / 会话。
      x-requires-permission: ""
      x-audit: true
      responses:
        '204':
          description: 已登出
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth:refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: 刷新访问令牌
      description: 以 refresh token 换取新的 access token。
      x-requires-permission: ""
      x-audit: false
      x-allow-without-credential: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth:passwordReset:request:
    post:
      tags: [Auth]
      operationId: authPasswordResetRequest
      summary: 发起密码重置
      description: 校验邮箱存在性后下发重置凭证（实现选定通道，v1 站内/邮件自定）。
      x-requires-permission: ""
      x-audit: false
      x-allow-without-credential: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: 已受理（无论邮箱是否存在，均返回 204 防枚举）
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth:passwordReset:confirm:
    post:
      tags: [Auth]
      operationId: authPasswordResetConfirm
      summary: 确认密码重置
      description: 以重置凭证 + 新密码完成修改，校验新密码强度。
      x-requires-permission: ""
      x-audit: true
      x-allow-without-credential: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: 密码已重置
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /v1/auth/csrf:
    get:
      tags: [Auth]
      operationId: authCsrf
      summary: 获取 CSRF 令牌
      description: |
        Cookie 写操作采用双提交 CSRF：首屏由此下发 `X-CSRF-Token`，
        后续 POST/PATCH/DELETE 请求头回传。纯 Bearer 调用不受 CSRF 影响。
      x-requires-permission: ""
      x-audit: false
      x-allow-without-credential: true
      security: []
      responses:
        '200':
          description: CSRF 令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── SQL ─────────────────────────────
  /v1/projects/{project}/instances/{instance}/databases/{database}:query:
    post:
      tags: [SQL]
      operationId: sqlQuery
      summary: 执行 SQL 查询
      description: |
        核心查询路径。多语句（分号分隔）首请求执行全部语句，响应 `results[]` 按序返回每条语句的首页；
        取某结果集下一页 → 带 `page_token` 再次 POST `:query`（此时 `statement` 忽略，服务端按 token 续读）。
        只读强制；语句超时、行数/字节上限按环境策略 `environment_policies` 生效。
      x-requires-permission: db.sql.select
      x-audit: true
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Instance'
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: 查询结果（多语句按序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
        default: { $ref: '#/components/responses/Error' }

  /v1/projects/{project}/instances/{instance}/databases/{database}:export:
    post:
      tags: [SQL]
      operationId: sqlExport
      summary: 同步导出
      description: |
        小结果集同步导出，返回用户自设密码加密的 ZIP 字节流。
        预估 >1 万行（EXPLAIN 估算，见 D22）→ `412 EXPORT_TOO_LARGE_FOR_SYNC`，改走异步 ExportTask。
      x-requires-permission: db.sql.select
      x-audit: true
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Instance'
        - $ref: '#/components/parameters/Database'
        - $ref: '#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: 加密 ZIP 字节流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
        default: { $ref: '#/components/responses/Error' }

  /v1/queryHistories:search:
    get:
      tags: [SQL]
      operationId: queryHistoriesSearch
      summary: 检索查询历史
      description: 仅返回调用者本人的查询/导出历史（按归属判定，非 ACL）。
      x-requires-permission: ""
      x-audit: false
      x-auth-method: CUSTOM
      parameters:
        - name: database
          in: query
          description: 按数据库资源名过滤（可选）。
          required: false
          schema: { type: string }
        - name: keyword
          in: query
          description: 语句关键字模糊匹配（可选）。
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: 查询历史列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListQueryHistoriesResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Export ─────────────────────────────
  /v1/projects/{project}/exportTasks:
    post:
      tags: [Export]
      operationId: createExportTask
      summary: 创建异步导出任务
      description: |
        异步导出大结果集；幂等创建支持请求头 `X-Request-Id`。
        任务完成后向发起人推站内通知（`export_done`）。
      x-requires-permission: db.exports.create
      x-audit: true
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportTaskRequest'
      responses:
        '200':
          description: 已创建（或幂等命中既有任务）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportTask'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

    get:
      tags: [Export]
      operationId: listExportTasks
      summary: 列出导出任务
      description: 返回项目内调用者可见的导出任务（鉴权过滤）。
      x-requires-permission: ""
      x-audit: false
      x-auth-method: CUSTOM
      parameters:
        - $ref: '#/components/parameters/Project'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ExportTaskState'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: 导出任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListExportTasksResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/projects/{project}/exportTasks/{task}:
    get:
      tags: [Export]
      operationId: getExportTask
      summary: 获取导出任务
      description: 查询任务状态、行数、产物引用等。
      x-requires-permission: ""
      x-audit: false
      x-auth-method: CUSTOM
      parameters:
        - $ref: '#/components/parameters/Project'
        - name: task
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 导出任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportTask'
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/projects/{project}/exportTasks/{task}:download:
    post:
      tags: [Export]
      operationId: downloadExportTask
      summary: 下载导出产物
      description: |
        校验用户自设 ZIP 密码；错误 → `403 EXPORT_PASSWORD_INVALID`。
        产物过期已清理 → `404 EXPORT_ARCHIVE_EXPIRED`。下载流式解密下发。
      x-requires-permission: ""
      x-audit: true
      x-auth-method: CUSTOM
      parameters:
        - $ref: '#/components/parameters/Project'
        - name: task
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadExportRequest'
      responses:
        '200':
          description: 加密 ZIP 字节流（流式解密下发）
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Instance ─────────────────────────────
  /v1/projects/{project}/instances:
    post:
      tags: [Instance]
      operationId: createInstance
      summary: 创建实例
      description: 在项目内注册一个数据库实例；必须标注环境。支持 `validate_only`（测试连接，不落库）。
      x-requires-permission: db.instances.create
      x-audit: true
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '200':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

    get:
      tags: [Instance]
      operationId: listInstances
      summary: 列出实例
      description: 返回项目内调用者可见的实例（鉴权过滤）。
      x-requires-permission: db.instances.list
      x-audit: false
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: 实例列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstancesResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v1/projects/{project}/instances/{instance}:
    get:
      tags: [Instance]
      operationId: getInstance
      summary: 获取实例
      x-requires-permission: db.instances.get
      x-audit: false
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Instance'
      responses:
        '200':
          description: 实例详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

    patch:
      tags: [Instance]
      operationId: updateInstance
      summary: 更新实例
      description: PATCH + JSON Merge Patch；可改展示名、同步间隔、设置等。
      x-requires-permission: db.instances.update
      x-audit: true
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Instance'
        - $ref: '#/components/parameters/XCSRFToken'
        - $ref: '#/components/parameters/UpdateMask'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instance'
      responses:
        '200':
          description: 更新后的实例
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

    delete:
      tags: [Instance]
      operationId: deleteInstance
      summary: 删除实例（软删）
      x-requires-permission: db.instances.delete
      x-audit: true
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Instance'
        - $ref: '#/components/parameters/XCSRFToken'
      responses:
        '204':
          description: 已删除
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/projects/{project}/instances/{instance}:sync:
    post:
      tags: [Instance]
      operationId: syncInstance
      summary: 触发实例元数据同步
      description: |
        即时返回 202 + 当前 `sync_status` + 触发时间；后台异步执行（D41）。
        完成后写 `last_sync_time`/`sync_status`，可选推站内通知。不引入 LRO 轮询。
      x-requires-permission: db.instances.sync
      x-audit: true
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Instance'
        - $ref: '#/components/parameters/XCSRFToken'
      responses:
        '202':
          description: 已触发同步
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v1/projects/{project}/instances/{instance}:testConnection:
    post:
      tags: [Instance]
      operationId: testInstanceConnection
      summary: 测试实例连接
      description: 以请求体中的数据源凭据尝试连接（`validate_only` 语义），不落库。
      x-requires-permission: db.instances.get
      x-audit: false
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Instance'
        - $ref: '#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionRequest'
      responses:
        '200':
          description: 连接测试结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestConnectionResponse'
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Error' }

