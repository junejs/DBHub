  /v1/projects/{project}/worksheets:search:
    get:
      tags: [Worksheet]
      operationId: searchWorksheets
      summary: 检索 Worksheet
      description: 返回项目内调用者可见的 worksheet（可见性 + 归属）。
      x-requires-permission: ""
      x-audit: false
      x-auth-method: CUSTOM
      parameters:
        - $ref: '../components.yaml#/components/parameters/Project'
        - name: keyword
          in: query
          required: false
          schema: { type: string }
        - name: database
          in: query
          required: false
          schema: { type: string }
        - $ref: '../components.yaml#/components/parameters/PageSize'
        - $ref: '../components.yaml#/components/parameters/PageToken'
      responses:
        '200':
          description: worksheet 列表
          content:
            application/json:
              schema:
                $ref: '../components.yaml#/components/schemas/ListWorksheetsResponse'
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        default: { $ref: '../components.yaml#/components/responses/Error' }


