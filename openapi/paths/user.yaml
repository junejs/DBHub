  /v1/users:
    post:
      tags: [User]
      operationId: createUser
      summary: 创建用户
      description: 仅 workspaceAdmin。kind=user。
      x-requires-permission: db.users.create
      x-audit: true
      parameters:
        - $ref: '../components.yaml#/components/parameters/XRequestId'
        - $ref: '../components.yaml#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '../components.yaml#/components/schemas/User'
        '400': { $ref: '../components.yaml#/components/responses/Error' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        default: { $ref: '../components.yaml#/components/responses/Error' }

    get:
      tags: [User]
      operationId: listUsers
      summary: 列出用户
      x-requires-permission: db.users.list
      x-audit: false
      parameters:
        - $ref: '../components.yaml#/components/parameters/PageSize'
        - $ref: '../components.yaml#/components/parameters/PageToken'
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: '../components.yaml#/components/schemas/ListUsersResponse'
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        default: { $ref: '../components.yaml#/components/responses/Error' }


  /v1/users/me:mfa:regenerate:
    post:
      tags: [User]
      operationId: regenerateMyMfa
      summary: 重新生成 MFA 密钥
      description: 重新生成 TOTP secret（应用层加密）与恢复码，返回一次性置顶信息。
      x-requires-permission: ""
      x-audit: true
      x-auth-method: CUSTOM
      parameters:
        - $ref: '../components.yaml#/components/parameters/XCSRFToken'
      responses:
        '200':
          description: 新的 MFA 置顶信息
          content:
            application/json:
              schema:
                $ref: '../components.yaml#/components/schemas/MfaSetupResponse'
        '401': { $ref: '../components.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../components.yaml#/components/responses/Error' }


  /v1/users/me:password:
    post:
      tags: [User]
      operationId: changeMyPassword
      summary: 修改自身密码
      description: 校验旧密码 + 新密码强度（自身改密，按归属判定）。
      x-requires-permission: ""
      x-audit: true
      x-auth-method: CUSTOM
      parameters:
        - $ref: '../components.yaml#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 密码已修改
        '400': { $ref: '../components.yaml#/components/responses/Error' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../components.yaml#/components/responses/Error' }


  /v1/users/{user}:
    get:
      tags: [User]
      operationId: getUser
      summary: 获取用户
      x-requires-permission: db.users.get
      x-audit: false
      parameters:
        - $ref: '../components.yaml#/components/parameters/User'
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: '../components.yaml#/components/schemas/User'
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        default: { $ref: '../components.yaml#/components/responses/Error' }

    patch:
      tags: [User]
      operationId: updateUser
      summary: 更新用户
      x-requires-permission: db.users.update
      x-audit: true
      parameters:
        - $ref: '../components.yaml#/components/parameters/User'
        - $ref: '../components.yaml#/components/parameters/XCSRFToken'
        - $ref: '../components.yaml#/components/parameters/UpdateMask'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/User'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: '../components.yaml#/components/schemas/User'
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        default: { $ref: '../components.yaml#/components/responses/Error' }

    delete:
      tags: [User]
      operationId: deleteUser
      summary: 禁用用户（soft，D28）
      description: 默认禁用（status=disabled）；worksheet 保留为孤儿（creator 标已禁用）。
      x-requires-permission: db.users.delete
      x-audit: true
      parameters:
        - $ref: '../components.yaml#/components/parameters/User'
        - $ref: '../components.yaml#/components/parameters/XCSRFToken'
      responses:
        '204':
          description: 已禁用
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        default: { $ref: '../components.yaml#/components/responses/Error' }


  /v1/users/{user}:undelete:
    post:
      tags: [User]
      operationId: undeleteUser
      summary: 恢复用户
      x-requires-permission: db.users.update
      x-audit: true
      parameters:
        - $ref: '../components.yaml#/components/parameters/User'
        - $ref: '../components.yaml#/components/parameters/XCSRFToken'
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema:
                $ref: '../components.yaml#/components/schemas/User'
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        default: { $ref: '../components.yaml#/components/responses/Error' }

