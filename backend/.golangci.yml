version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck      # 必须检查返回的 error
    - govet         # go vet 检查
    - ineffassign   # 无效赋值
    - staticcheck   # 综合静态分析
    - unused        # 未使用代码
    - gocritic      # 代码改进建议
    - misspell      # 拼写
    - unconvert     # 多余类型转换
    - bodyclose     # http.Response.Body 必须关闭
    - rowserrcheck  # sql.Rows.Err 必须检查（配合 database/sql）

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  gocyclo:
    min-complexity: 15
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  exclude-rules:
    # 生成代码不纳入 lint（ogen 产出，重新生成会覆盖）
    - path: internal/oas
      linters:
        - errcheck
        - govet
        - staticcheck
        - unused
        - gocritic
        - gosec
        - ineffassign
  exclude:
    # chi's middleware.RealIP is intentional behind our trust boundary.
    - 'middleware\.RealIP'
    # testcontainers helper: RunContainer is the documented entry point in v0.43.
    - 'tcpostgres\.RunContainer is deprecated'
    # main package & cmd/migrate CLI use os.Exit on error paths intentionally;
    # the deferred cleanup is best-effort, not safety-critical.
    - 'exitAfterDefer'
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: true